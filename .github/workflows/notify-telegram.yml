name: Notify Telegram on Push

on:
  push:
    branches:
      - 14.0

jobs:
  notify:
    name: Send Telegram Notification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and send Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_CODE_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          PUSHER="${{ github.actor }}"
          COMPARE_URL="${{ github.event.compare }}"

          # Ambil semua commit dalam push ini (urutan terlama → terbaru)
          COMMITS_JSON='${{ toJson(github.event.commits) }}'

          COMMIT_COUNT=$(echo "$COMMITS_JSON" | python3 -c "import sys,json; data=json.load(sys.stdin); print(len(data))")

          # Bangun daftar commit — HTML mode, escape karakter khusus agar tidak crash parser
          COMMIT_LIST=$(echo "$COMMITS_JSON" | python3 -c "
          import sys, json, html
          data = json.load(sys.stdin)
          lines = []
          # quote=False: jangan escape ' dan " — Telegram HTML hanya kenal
          # &lt; &gt; &amp; &quot;; entity numerik &#x27; (apostrof) ditolak
          # parser dan memicu 'can't parse entities'. ' dan " aman sbg literal.
          for c in data:
              sha    = c['id'][:7]
              msg    = c['message'].strip()
              author = html.escape(c['author']['name'], quote=False)
              ts     = c['timestamp'][:16].replace('T', ' ')  # YYYY-MM-DD HH:MM

              msg_lines = msg.split('\n')
              title = html.escape(msg_lines[0][:80], quote=False)
              body_lines = [html.escape(l, quote=False) for l in msg_lines[1:] if l.strip()]

              entry = f'  <code>{sha}</code> {title}\n    👤 {author}  🕐 {ts}'
              if body_lines:
                  indented = '\n'.join(f'    {l}' for l in body_lines)
                  entry += f'\n{indented}'
              lines.append(entry)
          print('\n\n'.join(lines))
          ")

          if [ "$COMMIT_COUNT" -eq 1 ]; then
            HEADER="📝 <b>1 commit baru</b> di <code>${REPO}</code>"
          else
            HEADER="📦 <b>${COMMIT_COUNT} commit baru</b> di <code>${REPO}</code>"
          fi

          MESSAGE="${HEADER}
          Branch: <code>${BRANCH}</code>
          Pusher: @${PUSHER}

          ${COMMIT_LIST}

          🔗 <a href=\"${COMPARE_URL}\">Lihat perubahan</a>"

          # Kirim ke Telegram via Bot API — periksa response agar step gagal jika error
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true")

          echo "Telegram response: $RESPONSE"
          if ! echo "$RESPONSE" | python3 -c "import sys,json; r=json.load(sys.stdin); exit(0 if r.get('ok') else 1)"; then
            echo "::error::Gagal kirim pesan Telegram"
            exit 1
          fi
