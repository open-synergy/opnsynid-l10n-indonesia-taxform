scenarios:
  - name: "Bukti Potong PPh F113301 - Create and workflow"
    steps:
      - step: "Setup - Create tax year"
        action: "create"
        model: "l10n_id.tax_year"
        save_as: "tax_year"
        values:
          name: "Tax Year 2024 F113301"
          code: "TY2024F1"
          date_start: 2024-01-01
          date_end: 2024-12-31

      - step: "Setup - Create tax period"
        action: "create"
        model: "l10n_id.tax_period"
        save_as: "tax_period"
        values:
          name: "06/2024"
          code: "062024"
          date_start: 2024-06-01
          date_end: 2024-06-30
          year_id: "EVAL: registry['tax_year'].id"

      - step: "Setup - Create account type ref"
        action: "ref"
        xml_id: "account.data_account_type_current_liabilities"
        save_as: "account_type"

      - step: "Setup - Create account"
        action: "create"
        model: "account.account"
        save_as: "account"
        values:
          name: "PPh 21/26 Payable Test"
          code: "XPPH2126T1"
          user_type_id: "EVAL: registry['account_type'].id"
          internal_type: "other"
          reconcile: true

      - step: "Setup - Create journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "PPh 21/26 Journal Test"
          code: "XP2126T"
          type: "general"

      - step: "Setup - Create KPP partner"
        action: "create"
        model: "res.partner"
        save_as: "kpp"
        values:
          name: "KPP Test Gambir"
          is_company: true

      - step: "Setup - Create pemotong pajak partner"
        action: "create"
        model: "res.partner"
        save_as: "pemotong_pajak"
        values:
          name: "PT Test Pemotong Pajak"
          is_company: true

      - step: "Setup - Create wajib pajak partner"
        action: "create"
        model: "res.partner"
        save_as: "wajib_pajak"
        values:
          name: "Test Wajib Pajak Individual"
          is_company: false

      - step: "Get f113301 type from data"
        action: "ref"
        xml_id: "ssi_l10n_id_taxform_bukti_potong_pph_f113301.bukti_potong_pph_type_f113301_out"
        save_as: "bp_type"

      - step: "Create Bukti Potong PPh F113301 Out"
        action: "create"
        model: "l10n_id.bukti_potong_pph_f113301_out"
        save_as: "bukpot"
        as_user: "base.user_admin"
        values:
          type_id: "EVAL: registry['bp_type'].id"
          date: 2024-06-15
          tax_period_id: "EVAL: registry['tax_period'].id"
          journal_id: "EVAL: registry['journal'].id"
          account_id: "EVAL: registry['account'].id"
          kpp_id: "EVAL: registry['kpp'].id"
          wajib_pajak_id: "EVAL: registry['wajib_pajak'].id"
          pemotong_pajak_id: "EVAL: registry['pemotong_pajak'].id"

      - step: "Assert bukpot created in draft"
        action: "assert"
        target: "bukpot"
        asserts:
          state:
            type: "value"
            expected: "draft"
          direction:
            type: "value"
            expected: "out"

      - step: "Confirm bukpot"
        action: "call"
        target: "bukpot"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

  - name: "Bukti Potong PPh F113301 - Cancel policy restricted to Done"
    steps:
      - step: "Setup - Create tax year"
        action: "create"
        model: "l10n_id.tax_year"
        save_as: "tax_year"
        values:
          name: "Tax Year 2024 F113301 Cancel"
          code: "TY24F1CN"
          date_start: 2024-01-01
          date_end: 2024-12-31

      - step: "Setup - Create tax period"
        action: "create"
        model: "l10n_id.tax_period"
        save_as: "tax_period"
        values:
          name: "07/2024 Cancel"
          code: "072024CN"
          date_start: 2024-07-01
          date_end: 2024-07-31
          year_id: "REC: tax_year.id"

      - step: "Setup - Create account type ref"
        action: "ref"
        xml_id: "account.data_account_type_current_liabilities"
        save_as: "account_type"

      - step: "Setup - Create account"
        action: "create"
        model: "account.account"
        save_as: "account"
        values:
          name: "PPh 21/26 Payable Cancel Test"
          code: "XPPH2126CN"
          user_type_id: "REC: account_type.id"
          internal_type: "other"
          reconcile: true

      - step: "Setup - Create journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "PPh 21/26 Journal Cancel Test"
          code: "XP2126CN"
          type: "general"

      - step: "Setup - Create KPP partner"
        action: "create"
        model: "res.partner"
        save_as: "kpp"
        values:
          name: "KPP Test Gambir Cancel"
          is_company: true

      - step: "Setup - Create pemotong pajak partner"
        action: "create"
        model: "res.partner"
        save_as: "pemotong_pajak"
        values:
          name: "PT Test Pemotong Pajak Cancel"
          is_company: true

      - step: "Setup - Create wajib pajak partner"
        action: "create"
        model: "res.partner"
        save_as: "wajib_pajak"
        values:
          name: "Test Wajib Pajak Individual Cancel"
          is_company: false

      - step: "Setup - Create income account type ref"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "income_account_type"

      - step: "Setup - Create income account"
        action: "create"
        model: "account.account"
        save_as: "income_account"
        values:
          name: "Income Account F113301 Cancel"
          code: "IF1CN"
          user_type_id: "REC: income_account_type.id"
          internal_type: "other"
          reconcile: true

      - step: "Setup - Create withholding tax"
        action: "create"
        model: "account.tax"
        save_as: "tax"
        values:
          name: "Tax F113301 Cancel"
          amount_type: "percent"
          type_tax_use: "none"
          amount: 5.0
          invoice_repartition_line_ids:
            - - 5
              - 0
              - 0
            - - 0
              - 0
              - factor_percent: 100
                repartition_type: "base"
            - - 0
              - 0
              - factor_percent: 100
                repartition_type: "tax"
                account_id: "REC: account.id"

      - step: "Setup - Create income journal entry"
        action: "create"
        model: "account.move"
        save_as: "income_move"
        values:
          move_type: "entry"
          journal_id: "REC: journal.id"
          date: 2024-07-15
          line_ids:
            - - 0
              - 0
              - account_id: "REC: income_account.id"
                partner_id: "REC: wajib_pajak.id"
                name: "Income line F113301 Cancel"
                debit: 1000000.0
                credit: 0.0
            - - 0
              - 0
              - account_id: "REC: account.id"
                partner_id: "REC: wajib_pajak.id"
                name: "Contra line F113301 Cancel"
                debit: 0.0
                credit: 1000000.0

      - step: "Setup - Post income journal entry"
        action: "call"
        target: "income_move"
        method: "action_post"

      - step: "Setup - Find income move line"
        action: "search"
        model: "account.move.line"
        domain:
          - ["move_id", "=", "REC: income_move.id"]
          - ["account_id", "=", "REC: income_account.id"]
        save_as: "income_line"
        expect_count: 1

      - step: "Get f113301 type from data"
        action: "ref"
        xml_id: "ssi_l10n_id_taxform_bukti_potong_pph_f113301.bukti_potong_pph_type_f113301_out"
        save_as: "bp_type"

      - step: "Create Bukti Potong PPh F113301 Out"
        action: "create"
        model: "l10n_id.bukti_potong_pph_f113301_out"
        save_as: "bukpot"
        as_user: "base.user_admin"
        values:
          type_id: "REC: bp_type.id"
          date: 2024-07-15
          tax_period_id: "REC: tax_period.id"
          journal_id: "REC: journal.id"
          account_id: "REC: account.id"
          kpp_id: "REC: kpp.id"
          wajib_pajak_id: "REC: wajib_pajak.id"
          pemotong_pajak_id: "REC: pemotong_pajak.id"
          line_ids:
            - - 0
              - 0
              - tax_id: "REC: tax.id"
                move_line_id: "REC: income_line.id"
                amount_computation_method: "manual"
                manual_amount: 1000000.0

      - step: "Confirm bukpot"
        action: "call"
        target: "bukpot"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Cancel is rejected while Waiting for Approval"
        action: "call"
        target: "bukpot"
        method: "action_cancel"
        as_user: "base.user_admin"
        expect_error:
          type: "UserError"
          message_contains: "not allowed to cancel"

      - step: "Approve bukpot"
        action: "call"
        target: "bukpot"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Finish bukpot"
        action: "call"
        target: "bukpot"
        method: "action_done"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "done"

      - step: "Cancel is allowed once Done"
        action: "call"
        target: "bukpot"
        method: "action_cancel"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "cancel"

