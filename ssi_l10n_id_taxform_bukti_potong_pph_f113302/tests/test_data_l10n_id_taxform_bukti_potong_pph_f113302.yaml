        action: "ref"
        xml_id: "ssi_l10n_id_taxform_bukti_potong_pph_f113302.bukti_potong_pph_type_f113302_out"
        save_as: "bp_type"

      - step: "Create Bukti Potong PPh F113302 Out without manual number"
        action: "create"
        model: "l10n_id.bukti_potong_pph_f113302_out"
        save_as: "bukpot"
        as_user: "base.user_admin"
        values:
