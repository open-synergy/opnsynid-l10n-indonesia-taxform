        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve bukpot auto-assigns the sequence on entering On Progress"
        action: "call"
        target: "bukpot"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "open"
          name:
            type: "value"
            operator: "not_equals"
            expected: "/"

      - step: "Snapshot the auto-assigned number before Done"
        action: "create"
        model: "res.partner"
        save_as: "name_snapshot"
        values:
          name: "Snapshot F113304 Out Negatif"
          comment: "REC: bukpot.name"

      - step: "Finish bukpot"
        action: "call"
        target: "bukpot"
        method: "action_done"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "done"

      - step: "Assert auto-assigned number unchanged after Done"
        action: "assert"
        target: "bukpot"
        asserts:
          name:
            type: "value"
            expected: "REC: name_snapshot.comment"

