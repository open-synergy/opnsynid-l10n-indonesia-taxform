scenarios:
  - name: "Bukti Potong PPh F113308 OUT - Create and workflow"
    steps:
      - step: "Setup - Create tax year"
        action: "create"
        model: "l10n_id.tax_year"
        save_as: "tax_year"
        values:
          name: "Tax Year 2024 F113308"
          code: "TY2024F8"
          date_start: 2024-01-01
          date_end: 2024-12-31

      - step: "Setup - Create tax period"
        action: "create"
        model: "l10n_id.tax_period"
        save_as: "tax_period"
        values:
          name: "11/2024 F8"
          code: "112024F8"
          date_start: 2024-11-01
          date_end: 2024-11-30
          year_id: "EVAL: registry['tax_year'].id"

      - step: "Setup - Create account type ref"
        action: "ref"
        xml_id: "account.data_account_type_current_liabilities"
        save_as: "account_type"

      - step: "Setup - Create account"
        action: "create"
        model: "account.account"
        save_as: "account"
        values:
          name: "PPh 26 Payable Test F8"
          code: "XPPH26TF8"
          user_type_id: "EVAL: registry['account_type'].id"
          internal_type: "other"
          reconcile: true

      - step: "Setup - Create journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "PPh 26 Journal Test F8"
          code: "XP26TF8"
          type: "general"

      - step: "Setup - Create KPP partner"
        action: "create"
        model: "res.partner"
        save_as: "kpp"
        values:
          name: "KPP Test F113308"
          is_company: true

      - step: "Setup - Create pemotong pajak partner"
        action: "create"
        model: "res.partner"
        save_as: "pemotong_pajak"
        values:
          name: "PT Test F113308"
          is_company: true

      - step: "Setup - Create wajib pajak partner"
        action: "create"
        model: "res.partner"
        save_as: "wajib_pajak"
        values:
          name: "Wajib Pajak F113308"
          is_company: false

      - step: "Get f113308 OUT type from data"
        action: "ref"
        xml_id: "ssi_l10n_id_taxform_bukti_potong_pph_f113308.bukti_potong_pph_type_f113308_out"
        save_as: "bp_type"

      - step: "Create Bukti Potong PPh F113308 Out"
        action: "create"
        model: "l10n_id.bukti_potong_pph_f113308_out"
        save_as: "bukpot_out"
        as_user: "base.user_admin"
        values:
          type_id: "EVAL: registry['bp_type'].id"
          date: 2024-11-15
          tax_period_id: "EVAL: registry['tax_period'].id"
          journal_id: "EVAL: registry['journal'].id"
          account_id: "EVAL: registry['account'].id"
          kpp_id: "EVAL: registry['kpp'].id"
          wajib_pajak_id: "EVAL: registry['wajib_pajak'].id"
          pemotong_pajak_id: "EVAL: registry['pemotong_pajak'].id"

      - step: "Assert bukpot out created in draft"
        action: "assert"
        target: "bukpot_out"
        asserts:
          state:
            type: "value"
            expected: "draft"

      - step: "Confirm bukpot out"
        action: "call"
        target: "bukpot_out"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

