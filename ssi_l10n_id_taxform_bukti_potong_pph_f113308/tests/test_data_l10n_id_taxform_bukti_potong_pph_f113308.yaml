        action: "ref"
        xml_id: "ssi_l10n_id_taxform_bukti_potong_pph_f113308.bukti_potong_pph_type_f113308_out"
        save_as: "bp_type"

      - step: "Create Bukti Potong PPh F113308 Out without manual number"
        action: "create"
        model: "l10n_id.bukti_potong_pph_f113308_out"
        save_as: "bukpot"
        as_user: "base.user_admin"
        values:
          type_id: "REC: bp_type.id"
          date: 2024-10-15
          tax_period_id: "REC: tax_period.id"
          journal_id: "REC: journal.id"
          account_id: "REC: account.id"
