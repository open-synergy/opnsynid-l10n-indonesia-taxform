scenarios:
  - name: "amount_tax falls back to tax_id.compute_all() when rate was never configured"
    steps:
      - step: "Create tax year"
        action: "create"
        model: "l10n_id.tax_year"
        save_as: "tax_year"
        values:
          name: "TYAMTXFB"
          code: "TYAMTXFB"
          date_start: 2038-01-01
          date_end: 2038-12-31

      - step: "Generate tax periods for the year"
        action: "call"
        target: "tax_year"
        method: "action_create_period"

      - step: "Find the October 2038 tax period"
        action: "search"
        model: "l10n_id.tax_period"
        domain:
          - ["year_id", "=", "REC: tax_year.id"]
          - ["date_start", "=", 2038-10-01]
        limit: 1
        save_as: "tax_period"

      - step: "Create general journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Test Journal Amount Tax Fallback"
          code: "TJAMTXFB"
          type: "general"

      - step: "Create account for the bukti potong"
        action: "create"
        model: "account.account"
        save_as: "account"
        values:
          name: "Test PPh 21 Payable Amount Tax Fallback"
          code: "22402TSTAMTXFB"
          user_type_id: "account.data_account_type_current_liabilities"

      - step: "Create account move with a debit/credit line pair"
        action: "create"
        model: "account.move"
        save_as: "move"
        values:
          journal_id: "REC: journal.id"
          line_ids:
            - - 0
              - 0
              - account_id: "REC: account.id"
                name: "Test Debit Amount Tax Fallback"
                debit: 5000000.0
                credit: 0.0
            - - 0
              - 0
              - account_id: "REC: account.id"
                name: "Test Credit Amount Tax Fallback"
                debit: 0.0
                credit: 5000000.0

      - step: "Find the debit move line"
        action: "search"
        model: "account.move.line"
        domain:
          - ["move_id", "=", "REC: move.id"]
          - ["debit", ">", 0]
        limit: 1
        save_as: "move_line"

      - step: "Create a withholding tax at a nonzero 10%"
        action: "create"
        model: "account.tax"
        save_as: "tax"
        values:
          name: "PPh 21 Amount Tax Fallback Test 10%"
          type_tax_use: "purchase"
          amount: 10.0
          amount_type: "percent"

      - step: "Create KPP partner"
        action: "create"
        model: "res.partner"
        save_as: "kpp"
        values:
          name: "KPP Test Amount Tax Fallback"
          is_company: true

      - step: "Create wajib pajak partner"
        action: "create"
        model: "res.partner"
        save_as: "wajib_pajak"
        values:
          name: "Test Wajib Pajak Amount Tax Fallback"
          is_company: false

      - step: "Create pemotong pajak partner"
        action: "create"
        model: "res.partner"
        save_as: "pemotong_pajak"
        values:
          name: "PT Test Pemotong Pajak Amount Tax Fallback"
          is_company: true

      - step:
          "Create Bukti Potong PPh F113301 Out with a legacy line (no Coretax rate
          configured)"
        action: "create"
        model: "l10n_id.bukti_potong_pph_f113301_out"
        save_as: "bukpot"
        values:
          date: 2038-10-15
          tax_period_id: "REC: tax_period.id"
          journal_id: "REC: journal.id"
          account_id: "REC: account.id"
          kpp_id: "REC: kpp.id"
          wajib_pajak_id: "REC: wajib_pajak.id"
          pemotong_pajak_id: "REC: pemotong_pajak.id"
          line_ids:
            - - 0
              - 0
              - name: "Legacy Line No Coretax Rate"
                tax_id: "REC: tax.id"
                move_line_id: "REC: move_line.id"
                amount_computation_method: "manual"
                manual_amount: 5000000.0

      - step: "Find the created line"
        action: "search"
        model: "l10n_id.bukti_potong_pph_f113301_out_line"
        domain:
          - ["bukti_potong_id", "=", "REC: bukpot.id"]
        limit: 1
        save_as: "line"

      - step: "Assert amount_tax falls back to tax_id.compute_all() (10% of amount)"
        action: "assert"
        target: "line"
        asserts:
          rate:
            type: "value"
            expected: 0.0
          amount:
            type: "value"
            expected: 5000000.0
          amount_tax:
            type: "value"
            expected: 500000.0
