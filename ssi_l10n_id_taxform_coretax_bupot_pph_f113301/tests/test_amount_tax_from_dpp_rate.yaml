scenarios:
  - name: "amount_tax follows dpp x rate and stays in sync after manual_rate write"
    steps:
      - step: "Create tax year"
        action: "create"
        model: "l10n_id.tax_year"
        save_as: "tax_year"
        values:
          name: "TYAMTX"
          code: "TYAMTX"
          date_start: 2038-01-01
          date_end: 2038-12-31

      - step: "Generate tax periods for the year"
        action: "call"
        target: "tax_year"
        method: "action_create_period"

      - step: "Find the October 2038 tax period"
        action: "search"
        model: "l10n_id.tax_period"
        domain:
          - ["year_id", "=", "REC: tax_year.id"]
          - ["date_start", "=", 2038-10-01]
        limit: 1
        save_as: "tax_period"

      - step: "Create general journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Test Journal Amount Tax"
          code: "TJAMTX"
          type: "general"

      - step: "Create account for the bukti potong"
        action: "create"
        model: "account.account"
        save_as: "account"
        values:
          name: "Test PPh 21 Payable Amount Tax"
          code: "22402TSTAMTX"
          user_type_id: "account.data_account_type_current_liabilities"

      - step: "Create account move with a debit/credit line pair"
        action: "create"
        model: "account.move"
        save_as: "move"
        values:
          journal_id: "REC: journal.id"
          line_ids:
            - - 0
              - 0
              - account_id: "REC: account.id"
                name: "Test Debit Amount Tax"
                debit: 10000000.0
                credit: 0.0
            - - 0
              - 0
              - account_id: "REC: account.id"
                name: "Test Credit Amount Tax"
                debit: 0.0
                credit: 10000000.0

      - step: "Find the debit move line"
        action: "search"
        model: "account.move.line"
        domain:
          - ["move_id", "=", "REC: move.id"]
          - ["debit", ">", 0]
        limit: 1
        save_as: "move_line"

      - step: "Create a withholding tax at 0%"
        action: "create"
        model: "account.tax"
        save_as: "tax"
        values:
          name: "PPh 21 Amount Tax Test 0%"
          type_tax_use: "purchase"
          amount: 0.0
          amount_type: "percent"

      - step: "Create a tax object code with deemed 1.0"
        action: "create"
        model: "l10n_id.taxform_objek_pajak"
        save_as: "objek_pajak"
        values:
          code: "21-999-90"
          name: "Test Amount Tax Deemed 1.0"
          deemed: 1.0

      - step: "Create KPP partner"
        action: "create"
        model: "res.partner"
        save_as: "kpp"
        values:
          name: "KPP Test Amount Tax"
          is_company: true

      - step: "Create wajib pajak partner"
        action: "create"
        model: "res.partner"
        save_as: "wajib_pajak"
        values:
          name: "Test Wajib Pajak Amount Tax"
          is_company: false

      - step: "Create pemotong pajak partner"
        action: "create"
        model: "res.partner"
        save_as: "pemotong_pajak"
        values:
          name: "PT Test Pemotong Pajak Amount Tax"
          is_company: true

      - step: "Create Bukti Potong PPh F113301 Out with one manual-rate line"
        action: "create"
        model: "l10n_id.bukti_potong_pph_f113301_out"
        save_as: "bukpot"
        values:
          date: 2038-10-15
          tax_period_id: "REC: tax_period.id"
          journal_id: "REC: journal.id"
          account_id: "REC: account.id"
          kpp_id: "REC: kpp.id"
          wajib_pajak_id: "REC: wajib_pajak.id"
          pemotong_pajak_id: "REC: pemotong_pajak.id"
          line_ids:
            - - 0
              - 0
              - name: "Amount Tax Line"
                tax_id: "REC: tax.id"
                move_line_id: "REC: move_line.id"
                amount_computation_method: "manual"
                manual_amount: 10000000.0
                coretax_tax_object_code: "REC: objek_pajak.id"
                rate_computation_method: "manual"
                manual_rate: 0.05

      - step: "Find the created line"
        action: "search"
        model: "l10n_id.bukti_potong_pph_f113301_out_line"
        domain:
          - ["bukti_potong_id", "=", "REC: bukpot.id"]
        limit: 1
        save_as: "line"

      - step: "Assert amount_tax equals dpp x 0.05, not 0 from the 0% tax_id"
        action: "assert"
        target: "line"
        asserts:
          dpp:
            type: "value"
            expected: 10000000.0
          rate:
            type: "value"
            expected: 0.05
          amount_tax:
            type: "value"
            expected: 500000.0

      - step: "Raise manual_rate from 0.05 to 0.10"
        action: "write"
        target: "line"
        values:
          manual_rate: 0.10

      - step: "Assert amount_tax followed rate proportionally"
        action: "assert"
        target: "line"
        asserts:
          rate:
            type: "value"
            expected: 0.10
          amount_tax:
            type: "value"
            expected: 1000000.0
