scenarios:
  - name: "A zero-rate line still yields amount_tax 0.0 and is rejected"
    steps:
      - step: "Create tax year"
        action: "create"
        model: "l10n_id.tax_year"
        save_as: "tax_year"
        values:
          name: "TYAMTX0"
          code: "TYAMTX0"
          date_start: 2038-01-01
          date_end: 2038-12-31

      - step: "Generate tax periods for the year"
        action: "call"
        target: "tax_year"
        method: "action_create_period"

      - step: "Find the October 2038 tax period"
        action: "search"
        model: "l10n_id.tax_period"
        domain:
          - ["year_id", "=", "REC: tax_year.id"]
          - ["date_start", "=", 2038-10-01]
        limit: 1
        save_as: "tax_period"

      - step: "Create general journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Test Journal Amount Tax Zero"
          code: "TJAMTX0"
          type: "general"

      - step: "Create account for the bukti potong"
        action: "create"
        model: "account.account"
        save_as: "account"
        values:
          name: "Test PPh 21 Payable Amount Tax Zero"
          code: "22402TSTAMTX0"
          user_type_id: "account.data_account_type_current_liabilities"

      - step: "Create account move with a debit/credit line pair"
        action: "create"
        model: "account.move"
        save_as: "move"
        values:
          journal_id: "REC: journal.id"
          line_ids:
            - - 0
              - 0
              - account_id: "REC: account.id"
                name: "Test Debit Amount Tax Zero"
                debit: 5000000.0
                credit: 0.0
            - - 0
              - 0
              - account_id: "REC: account.id"
                name: "Test Credit Amount Tax Zero"
                debit: 0.0
                credit: 5000000.0

      - step: "Find the debit move line"
        action: "search"
        model: "account.move.line"
        domain:
          - ["move_id", "=", "REC: move.id"]
          - ["debit", ">", 0]
        limit: 1
        save_as: "move_line"

      - step: "Create a withholding tax at 0%"
        action: "create"
        model: "account.tax"
        save_as: "tax"
        values:
          name: "PPh 21 Amount Tax Zero Test 0%"
          type_tax_use: "purchase"
          amount: 0.0
          amount_type: "percent"

      - step: "Create a tax object code with deemed 1.0"
        action: "create"
        model: "l10n_id.taxform_objek_pajak"
        save_as: "objek_pajak"
        values:
          code: "21-999-91"
          name: "Test Amount Tax Zero Deemed 1.0"
          deemed: 1.0

      - step: "Create KPP partner"
        action: "create"
        model: "res.partner"
        save_as: "kpp"
        values:
          name: "KPP Test Amount Tax Zero"
          is_company: true

      - step: "Create wajib pajak partner"
        action: "create"
        model: "res.partner"
        save_as: "wajib_pajak"
        values:
          name: "Test Wajib Pajak Amount Tax Zero"
          is_company: false

      - step: "Create pemotong pajak partner"
        action: "create"
        model: "res.partner"
        save_as: "pemotong_pajak"
        values:
          name: "PT Test Pemotong Pajak Amount Tax Zero"
          is_company: true

      - step: "Create Bukti Potong PPh F113301 Out with a zero-rate line — rejected"
        action: "create"
        model: "l10n_id.bukti_potong_pph_f113301_out"
        expect_error:
          type: "UserError"
          message_contains: "Total tax has to be greater than 0"
        values:
          date: 2038-10-15
          tax_period_id: "REC: tax_period.id"
          journal_id: "REC: journal.id"
          account_id: "REC: account.id"
          kpp_id: "REC: kpp.id"
          wajib_pajak_id: "REC: wajib_pajak.id"
          pemotong_pajak_id: "REC: pemotong_pajak.id"
          line_ids:
            - - 0
              - 0
              - name: "Amount Tax Zero Rate Line"
                tax_id: "REC: tax.id"
                move_line_id: "REC: move_line.id"
                amount_computation_method: "manual"
                manual_amount: 5000000.0
                coretax_tax_object_code: "REC: objek_pajak.id"
                rate_computation_method: "manual"
                manual_rate: 0.0
