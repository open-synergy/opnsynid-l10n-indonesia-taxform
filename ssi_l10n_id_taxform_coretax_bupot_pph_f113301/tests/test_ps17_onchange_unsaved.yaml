scenarios:
  - name:
      "Setting Rate Computation Auto + PS17 tax object on an unsaved (NewId) line does
      not crash"
    steps:
      - step: "Create tax year"
        action: "create"
        model: "l10n_id.tax_year"
        save_as: "tax_year"
        values:
          name: "TY17ONCH"
          code: "TY17ONCH"
          date_start: 2040-01-01
          date_end: 2040-12-31

      - step: "Generate tax periods for the year"
        action: "call"
        target: "tax_year"
        method: "action_create_period"

      - step: "Find the October 2040 tax period"
        action: "search"
        model: "l10n_id.tax_period"
        domain:
          - ["year_id", "=", "REC: tax_year.id"]
          - ["date_start", "=", 2040-10-01]
        limit: 1
        save_as: "tax_period"

      - step: "Create general journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Test Journal PS17 Onchange"
          code: "TJ17ONC"
          type: "general"

      - step: "Create account for the bukti potong"
        action: "create"
        model: "account.account"
        save_as: "account"
        values:
          name: "Test PPh 21 Payable PS17 Onchange"
          code: "22402TSTP17D"
          user_type_id: "account.data_account_type_current_liabilities"

      - step: "Create account move with a debit/credit line pair"
        action: "create"
        model: "account.move"
        save_as: "move"
        values:
          journal_id: "REC: journal.id"
          line_ids:
            - - 0
              - 0
              - account_id: "REC: account.id"
                name: "Test Debit PS17 Onchange"
                debit: 40000000.0
                credit: 0.0
            - - 0
              - 0
              - account_id: "REC: account.id"
                name: "Test Credit PS17 Onchange"
                debit: 0.0
                credit: 40000000.0

      - step: "Find the debit move line"
        action: "search"
        model: "account.move.line"
        domain:
          - ["move_id", "=", "REC: move.id"]
          - ["debit", ">", 0]
        limit: 1
        save_as: "move_line"

      - step: "Create a withholding tax"
        action: "create"
        model: "account.tax"
        save_as: "tax"
        values:
          name: "PPh 21 PS17 Test Onchange"
          type_tax_use: "purchase"
          amount: 0.0
          amount_type: "percent"

      - step: "Create a tax object code with tariff type PS17"
        action: "create"
        model: "l10n_id.taxform_objek_pajak"
        save_as: "objek_pajak"
        values:
          code: "21-999-04"
          name: "Test PS17 Tariff Type Onchange"
          tariff_type: "ps17"

      - step: "Create KPP partner"
        action: "create"
        model: "res.partner"
        save_as: "kpp"
        values:
          name: "KPP Test PS17 Onchange"
          is_company: true

      - step: "Create wajib pajak partner"
        action: "create"
        model: "res.partner"
        save_as: "wajib_pajak"
        values:
          name: "Test Wajib Pajak PS17 Onchange"
          is_company: false

      - step:
          "Create the TTD (signatory) partner, a non-company contact of the withholding
          company's own partner (pemotong_pajak_id defaults to the current company's
          partner for an 'out' document, and ttd_id's domain requires
          commercial_partner_id to match it)"
        action: "create"
        model: "res.partner"
        save_as: "ttd"
        values:
          name: "Test TTD PS17 Onchange"
          is_company: false
          parent_id: "EVAL: env.user.company_id.partner_id.id"

      - step: "Create the PPh 21 Rate table for this tax year"
        action: "create"
        model: "l10n_id.pph_21_rate"
        save_as: "rate_table"
        values:
          code: "RATE17ONCH"
          name: "Rate Table PS17 Onchange"
          date_start: 2040-01-01

      - step: "Add the progressive brackets (UU HPP: 5/15/25/30/35%)"
        action: "create"
        model: "l10n_id.pph_21_rate_line"
        values:
          rate_id: "REC: rate_table.id"
          min_income: 0.0
          pph_rate: 5.0

      - step: "Add the second bracket"
        action: "create"
        model: "l10n_id.pph_21_rate_line"
        values:
          rate_id: "REC: rate_table.id"
          min_income: 60000000.0
          pph_rate: 15.0

      - step:
          "Open a new Bukti Potong form and add a PS17 line, exactly like a user filling
          the popup before saving"
        action: "form"
        model: "l10n_id.bukti_potong_pph_f113301_out"
        save_as: "bukpot"
        ops:
          - set:
              date: 2040-10-15
          - set:
              tax_period_id: "REC: tax_period"
          - set:
              journal_id: "REC: journal"
          - set:
              account_id: "REC: account"
          - set:
              kpp_id: "REC: kpp"
          - set:
              wajib_pajak_id: "REC: wajib_pajak"
          - set:
              ttd_id: "REC: ttd"
          - new:
              field: "line_ids"
              values:
                tax_id: "REC: tax"
                move_line_id: "REC: move_line"
                amount_computation_method: "manual"
                manual_amount: 40000000.0
                coretax_tax_object_code: "REC: objek_pajak"
                rate_computation_method: "auto"

      - step: "Find the line created through the form"
        action: "search"
        model: "l10n_id.bukti_potong_pph_f113301_out_line"
        domain:
          - ["bukti_potong_id", "=", "REC: bukpot.id"]
        limit: 1
        save_as: "line"

      - step:
          "Assert the form saved without error and the rate matches the first bracket
          (no prior history)"
        action: "assert"
        target: "line"
        asserts:
          dpp:
            type: "value"
            expected: 40000000.0
          rate_computation_method:
            type: "value"
            expected: "auto"
          rate:
            type: "value"
            expected: 0.05
