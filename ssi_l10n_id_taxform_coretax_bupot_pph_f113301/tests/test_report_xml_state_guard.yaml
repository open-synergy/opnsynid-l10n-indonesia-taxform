scenarios:
  - name: "Coretax XML report is allowed only in open and done"
    steps:
      - step: "Setup - Create tax year"
        action: "create"
        model: "l10n_id.tax_year"
        save_as: "tax_year"
        values:
          name: "Tax Year Report State Guard"
          code: "TYRPTGRD"
          date_start: 2039-01-01
          date_end: 2039-12-31

      - step: "Setup - Create tax period"
        action: "create"
        model: "l10n_id.tax_period"
        save_as: "tax_period"
        values:
          name: "02/2039 Report State Guard"
          code: "0239RPTG"
          date_start: 2039-02-01
          date_end: 2039-02-28
          year_id: "REC: tax_year.id"

      - step: "Setup - Create account type ref"
        action: "ref"
        xml_id: "account.data_account_type_current_liabilities"
        save_as: "account_type"

      - step: "Setup - Create account"
        action: "create"
        model: "account.account"
        save_as: "account"
        values:
          name: "PPh 21/26 Payable Report State Guard"
          code: "22402RPTGRD"
          user_type_id: "REC: account_type.id"
          internal_type: "other"
          reconcile: true

      - step: "Setup - Create journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "PPh 21/26 Journal Report State Guard"
          code: "PJRPTG"
          type: "general"

      - step: "Setup - Create KPP partner"
        action: "create"
        model: "res.partner"
        save_as: "kpp"
        values:
          name: "KPP Test Report State Guard"
          is_company: true

      - step: "Setup - Create wajib pajak partner"
        action: "create"
        model: "res.partner"
        save_as: "wajib_pajak"
        values:
          name: "Test Wajib Pajak Report State Guard"
          is_company: false
          vat: "0123456789012000"

      - step: "Setup - Create pemotong pajak partner"
        action: "create"
        model: "res.partner"
        save_as: "pemotong_pajak"
        values:
          name: "PT Test Pemotong Pajak Report State Guard"
          is_company: true
          vat: "0029482015507000"
          nitku: "0029482015507000000000"

      - step: "Setup - Get f113301 Out type from data"
        action: "ref"
        xml_id: "ssi_l10n_id_taxform_bukti_potong_pph_f113301.bukti_potong_pph_type_f113301_out"
        save_as: "bp_type"

      - step: "Setup - Create account move with a debit/credit line pair"
        action: "create"
        model: "account.move"
        save_as: "move"
        values:
          journal_id: "REC: journal.id"
          line_ids:
            - - 0
              - 0
              - account_id: "REC: account.id"
                name: "Test Debit Report State Guard"
                debit: 10000000.0
                credit: 0.0
            - - 0
              - 0
              - account_id: "REC: account.id"
                name: "Test Credit Report State Guard"
                debit: 0.0
                credit: 10000000.0

      - step: "Post the source journal entry"
        action: "call"
        target: "move"
        method: "action_post"

      - step: "Find the debit move line"
        action: "search"
        model: "account.move.line"
        domain:
          - ["move_id", "=", "REC: move.id"]
          - ["debit", ">", 0]
        limit: 1
        save_as: "move_line"

      - step: "Create a withholding tax"
        action: "create"
        model: "account.tax"
        save_as: "tax"
        values:
          name: "PPh 21 Report State Guard Test"
          type_tax_use: "purchase"
          amount: 0.0
          amount_type: "percent"
          invoice_repartition_line_ids:
            - - 0
              - 0
              - repartition_type: "base"
                factor_percent: 100.0
            - - 0
              - 0
              - repartition_type: "tax"
                factor_percent: 100.0
                account_id: "REC: account.id"

      - step: "Get the 21-402-02 tax object code from module data"
        action: "ref"
        xml_id: "ssi_l10n_id_taxform_coretax_bupot_pph_f113301.l10n_id_taxform_objek_pajak_21_402_02"
        save_as: "objek_pajak"

      - step: "Create PTKP category"
        action: "create"
        model: "l10n_id.ptkp_category"
        save_as: "ptkp_categ"
        values:
          name: "TK/0 Report State Guard"
          code: "TK0RPTGRD"

      - step: "Get the Coretax XML report action"
        action: "ref"
        xml_id: "ssi_l10n_id_taxform_coretax_bupot_pph_f113301.coretax_xml_report"
        save_as: "xml_report"

      - step: "Create Bukti Potong PPh F113301 Out with one auto final_flat line"
        action: "create"
        model: "l10n_id.bukti_potong_pph_f113301_out"
        save_as: "bukpot"
        as_user: "base.user_admin"
        values:
          type_id: "REC: bp_type.id"
          date: 2039-02-15
          tax_period_id: "REC: tax_period.id"
          journal_id: "REC: journal.id"
          account_id: "REC: account.id"
          kpp_id: "REC: kpp.id"
          wajib_pajak_id: "REC: wajib_pajak.id"
          pemotong_pajak_id: "REC: pemotong_pajak.id"
          ptkp_category_id: "REC: ptkp_categ.id"
          withholding_date: 2039-02-15
          line_ids:
            - - 0
              - 0
              - name: "Honor Report State Guard"
                tax_id: "REC: tax.id"
                move_line_id: "REC: move_line.id"
                amount_computation_method: "manual"
                manual_amount: 10000000.0
                coretax_tax_object_code: "REC: objek_pajak.id"
                rate_computation_method: "auto"

      - step: "Draft state is rejected"
        action: "call"
        target: "xml_report"
        method: "_render_qweb_xml"
        args:
          - ["REC: bukpot.id"]
        expect_error:
          type: "UserError"
          message_contains: "not yet In Progress or Done"

      - step: "Confirm bukpot"
        action: "call"
        target: "bukpot"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Confirm state is rejected"
        action: "call"
        target: "xml_report"
        method: "_render_qweb_xml"
        args:
          - ["REC: bukpot.id"]
        expect_error:
          type: "UserError"
          message_contains: "not yet In Progress or Done"

      - step: "Approve bukpot"
        action: "call"
        target: "bukpot"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "open"
          name:
            type: "value"
            expected: "/"

      - step: "Open state with default name renders without error"
        action: "call"
        target: "xml_report"
        method: "_render_qweb_xml"
        args:
          - ["REC: bukpot.id"]

      - step: "Finish bukpot"
        action: "call"
        target: "bukpot"
        method: "action_done"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "done"

      - step: "Done state renders without error"
        action: "call"
        target: "xml_report"
        method: "_render_qweb_xml"
        args:
          - ["REC: bukpot.id"]
