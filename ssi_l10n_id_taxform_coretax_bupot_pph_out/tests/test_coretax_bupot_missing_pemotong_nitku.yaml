scenarios:
  - name: "Missing pemotong NITKU raises UserError"
    steps:
      - step: "Get the company (pemotong) partner"
        action: "search"
        model: "res.partner"
        domain:
          - ["id", "=", "REC: company.partner_id.id"]
        limit: 1
        save_as: "company_partner"

      - step: "Set valid NPWP and NITKU on the withholder partner"
        action: "write"
        target: "company_partner"
        values:
          vat: "0029482015507000"
          nitku: "0029482015507000000000"

      - step: "Clear the withholder NITKU"
        action: "write"
        target: "company_partner"
        values:
          nitku: false

      - step: "Create wajib pajak (income recipient) partner"
        action: "create"
        model: "res.partner"
        save_as: "wajib_pajak"
        values:
          name: "PT Wajib Pajak Test"
          is_company: true
          vat: "0123456789012000"

      - step: "Create KPP (tax office) partner"
        action: "create"
        model: "res.partner"
        save_as: "kpp"
        values:
          name: "KPP Pratama Test"
          is_company: true

      - step: "Create tax year"
        action: "create"
        model: "l10n_id.tax_year"
        save_as: "tax_year"
        values:
          name: "2032"
          code: "2032"
          date_start: "2032-01-01"
          date_end: "2032-12-31"

      - step: "Generate tax periods for the year"
        action: "call"
        target: "tax_year"
        method: "action_create_period"

      - step: "Find the October 2032 tax period"
        action: "search"
        model: "l10n_id.tax_period"
        domain:
          - ["year_id", "=", "REC: tax_year.id"]
          - ["date_start", "=", "2032-10-01"]
        limit: 1
        save_as: "tax_period"

      - step: "Create general journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Test General 2"
          code: "TSTBPG2"
          type: "general"

      - step: "Create account for the bukti potong"
        action: "create"
        model: "account.account"
        save_as: "account"
        values:
          name: "Test PPh 23 Payable 2"
          code: "22401TST2"
          user_type_id: "account.data_account_type_current_liabilities"

      - step: "Create account move with a debit/credit line pair"
        action: "create"
        model: "account.move"
        save_as: "move"
        values:
          journal_id: "REC: journal.id"
          line_ids:
            - - 0
              - 0
              - account_id: "REC: account.id"
                name: "Test Debit"
                debit: 10000000.0
                credit: 0.0
            - - 0
              - 0
              - account_id: "REC: account.id"
                name: "Test Credit"
                debit: 0.0
                credit: 10000000.0

      - step: "Find the debit move line"
        action: "search"
        model: "account.move.line"
        domain:
          - ["move_id", "=", "REC: move.id"]
          - ["debit", ">", 0]
        limit: 1
        save_as: "move_line"

      - step: "Create PPh 23 tax at 2%"
        action: "create"
        model: "account.tax"
        save_as: "tax"
        values:
          name: "PPh 23 2% Test 2"
          type_tax_use: "purchase"
          amount: 2.0
          amount_type: "percent"

      - step: "Create Coretax tax object code 23-100-01"
        action: "create"
        model: "l10n_id.taxform_objek_pajak"
        save_as: "objek_pajak"
        values:
          code: "23-100-01"
          name: "PPh 23 Interest Income Test"

      - step: "Create Bukti Potong PPh 23 Out with one taxed line"
        action: "create"
        model: "l10n_id.bukti_potong_pph_f113306_out"
        save_as: "bukpot"
        values:
          date: "2032-10-15"
          tax_period_id: "REC: tax_period.id"
          journal_id: "REC: journal.id"
          account_id: "REC: account.id"
          kpp_id: "REC: kpp.id"
          wajib_pajak_id: "REC: wajib_pajak.id"
          pemotong_pajak_id: "REC: company.partner_id.id"
          line_ids:
            - - 0
              - 0
              - name: "Test Line PPh 23"
                tax_id: "REC: tax.id"
                move_line_id: "REC: move_line.id"
                amount_computation_method: "manual"
                manual_amount: 10000000.0
                coretax_tax_object_code: "REC: objek_pajak.id"

      - step: "Preparing Coretax values raises for missing NITKU"
        action: "call"
        target: "bukpot"
        method: "_prepare_coretax_bupot_pph_out_values"
        expect_error:
          type: "UserError"
          message_contains: "has no NITKU (ID TKU) configured"
