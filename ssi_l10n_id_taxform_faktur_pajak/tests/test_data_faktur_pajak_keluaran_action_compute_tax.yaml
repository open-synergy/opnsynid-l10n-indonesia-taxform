scenarios:
  - name: "Compute Tax recalculates tax and pre_confirm_action auto-recomputes"
    steps:
      - step: "Get revenue account type"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "revenue_acc_type"

      - step: "Get current liabilities account type"
        action: "ref"
        xml_id: "account.data_account_type_current_liabilities"
        save_as: "liability_acc_type"

      - step: "Create income account"
        action: "create"
        model: "account.account"
        save_as: "income_account"
        values:
          code: "EVAL: 'FPKCTI%d' % env['account.account'].search_count([])"
          name: "Test Compute Tax FPK Income"
          user_type_id: "EVAL: registry['revenue_acc_type'].id"

      - step: "Create tax account"
        action: "create"
        model: "account.account"
        save_as: "tax_account"
        values:
          code: "EVAL: 'FPKCTT%d' % env['account.account'].search_count([])"
          name: "Test Compute Tax FPK VAT Payable"
          user_type_id: "EVAL: registry['liability_acc_type'].id"

      # `account_id` on the tax's own "tax" repartition line is what ends
      # up populating `faktur_pajak_keluaran_tax.account_id`
      # (required=True) when `action_compute_tax` calls
      # `_recompute_standard_tax()` -- without it, `compute_all()` returns
      # no account and the auto-created tax row violates the NOT NULL
      # constraint.
      - step: "Create a 12% output VAT (exclude)"
        action: "create"
        model: "account.tax"
        save_as: "tax_12"
        values:
          name:
            "EVAL: 'Test Compute Tax FPK VAT 12pct %d' %
            env['account.tax'].search_count([])"
          amount_type: "percent"
          amount: 12.0
          type_tax_use: "sale"
          price_include: false
          invoice_repartition_line_ids:
            - - 0
              - 0
              - factor_percent: 100
                repartition_type: "base"
            - - 0
              - 0
              - factor_percent: 100
                repartition_type: "tax"
                account_id: "EVAL: registry['tax_account'].id"
          refund_repartition_line_ids:
            - - 0
              - 0
              - factor_percent: 100
                repartition_type: "base"
            - - 0
              - 0
              - factor_percent: 100
                repartition_type: "tax"
                account_id: "EVAL: registry['tax_account'].id"

      - step: "Create an 11% output VAT (exclude)"
        action: "create"
        model: "account.tax"
        save_as: "tax_11"
        values:
          name:
            "EVAL: 'Test Compute Tax FPK VAT 11pct %d' %
            env['account.tax'].search_count([])"
          amount_type: "percent"
          amount: 11.0
          type_tax_use: "sale"
          price_include: false
          invoice_repartition_line_ids:
            - - 0
              - 0
              - factor_percent: 100
                repartition_type: "base"
            - - 0
              - 0
              - factor_percent: 100
                repartition_type: "tax"
                account_id: "EVAL: registry['tax_account'].id"
          refund_repartition_line_ids:
            - - 0
              - 0
              - factor_percent: 100
                repartition_type: "base"
            - - 0
              - 0
              - factor_percent: 100
                repartition_type: "tax"
                account_id: "EVAL: registry['tax_account'].id"

      - step: "Create an unrestricted transaction type (default tax domain)"
        action: "create"
        model: "faktur_pajak_transaction_type"
        save_as: "fp_type_open"
        values:
          name:
            "EVAL: 'Test Compute Tax FPK Type Open %d' %
            env['faktur_pajak_transaction_type'].search_count([])"
          code: "/"
          efaktur_mode: "detail"
          fpk_journal_selection_method: "domain"
          tax_id: "EVAL: registry['tax_12'].id"

      - step: "Create customer partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        as_user: "base.user_admin"
        values:
          name:
            "EVAL: 'Test Compute Tax FPK Partner %d' %
            env['res.partner'].search_count([])"
          is_company: true

      # `klikpajak_backend_id` is required on `faktur_pajak_keluaran` once
      # `ssi_l10n_id_taxform_faktur_pajak_klipajak` (a sibling addon in
      # this same repo) is installed -- which `oca_install_addons` always
      # does in CI (it installs every addon in the repo together, not
      # just this one's declared dependencies). Created unconditionally
      # here to match what CI actually tests against.
      - step: "Create klikpajak backend"
        action: "create"
        model: "klikpajak_backend"
        save_as: "klikpajak_backend"
        values:
          name:
            "EVAL: 'Test Compute Tax FPK Klikpajak Backend %d' %
            env['klikpajak_backend'].search_count([])"
          code: "/"
          base_url: "https://example.test"

      # `faktur_pajak_keluaran._compute_taxform_period` calls
      # `l10n_id.tax_period._find_period(date)` on every create -- and
      # that raises if no period record covers the date. Our local
      # `devel` DB is a production-like restore with tax periods for
      # almost every date, which masked this; CI's clean test DB has
      # none. Created explicitly (no `l10n_id.tax_year` needed --
      # `year_id` on `l10n_id.tax_period` is optional) to cover every
      # FPK date used below (2026-01-15).
      - step: "Create tax period covering 2026-01-15"
        action: "create"
        model: "l10n_id.tax_period"
        save_as: "tax_period"
        values:
          name: "Test Compute Tax FPK Period 01/2026"
          code: "/"
          date_start: 2026-01-01
          date_end: 2026-01-31

      - step: "Create Faktur Pajak Keluaran draft"
        action: "create"
        model: "faktur_pajak_keluaran"
        save_as: "fpk"
        as_user: "base.user_admin"
        values:
          type_id: "EVAL: registry['fp_type_open'].id"
          tax_id: "EVAL: registry['tax_12'].id"
          partner_id: "EVAL: registry['partner'].id"
          klikpajak_backend_id: "EVAL: registry['klikpajak_backend'].id"
          date: 2026-01-15
          efaktur_mode: "detail"

      - step: "Create first detail line taxed at 12%"
        action: "create"
        model: "faktur_pajak_keluaran_detail"
        save_as: "detail_1"
        as_user: "base.user_admin"
        values:
          faktur_pajak_keluaran_id: "EVAL: registry['fpk'].id"
          name: "Test Compute Tax FPK Line 1"
          account_id: "EVAL: registry['income_account'].id"
          uom_quantity: 1
          price_unit: 1000000.0
          tax_ids:
            - - 6
              - 0
              - - "EVAL: registry['tax_12'].id"

      - step: "Create second detail line taxed at 12%"
        action: "create"
        model: "faktur_pajak_keluaran_detail"
        save_as: "detail_2"
        as_user: "base.user_admin"
        values:
          faktur_pajak_keluaran_id: "EVAL: registry['fpk'].id"
          name: "Test Compute Tax FPK Line 2"
          account_id: "EVAL: registry['income_account'].id"
          uom_quantity: 1
          price_unit: 1000000.0
          tax_ids:
            - - 6
              - 0
              - - "EVAL: registry['tax_12'].id"

      - step: "No tax summary line exists before Compute Tax is called"
        action: "assert"
        target: "fpk"
        asserts:
          tax_ids:
            type: "o2m"
            check: "count"
            expected_count: 0
          amount_tax:
            type: "value"
            expected: 0.0
          amount_untaxed:
            type: "value"
            expected: 2000000.0

      - step: "Call action_compute_tax the first time"
        action: "call"
        target: "fpk"
        method: "action_compute_tax"
        as_user: "base.user_admin"

      - step: "One merged tax summary line is created for both 12% lines"
        action: "assert"
        target: "fpk"
        asserts:
          tax_ids:
            type: "o2m"
            check: "count"
            expected_count: 1
          amount_tax:
            type: "value"
            expected: 240000.0
          amount_total:
            type: "value"
            expected: 2240000.0

      - step: "Get the merged tax summary line"
        action: "search"
        model: "faktur_pajak_keluaran_tax"
        domain:
          - ["faktur_pajak_keluaran_id", "=", "EVAL: registry['fpk'].id"]
        save_as: "tax_line_12"
        expect_count: 1

      - step: "The merged tax line matches both 12% detail lines"
        action: "assert"
        target: "tax_line_12"
        asserts:
          base_amount:
            type: "value"
            expected: 2000000.0
          tax_amount:
            type: "value"
            expected: 240000.0

      # This is the reported production bug, reproduced step by step: the
      # user manually corrects one line's tax in the draft (e.g. to match
      # the source invoice), and the header tax summary does not follow
      # until Compute Tax is called again.
      - step: "Manually correct the second line's tax to 11%"
        action: "write"
        target: "detail_2"
        as_user: "base.user_admin"
        values:
          tax_ids:
            - - 6
              - 0
              - - "EVAL: registry['tax_11'].id"

      - step:
          "Before Compute Tax runs again, the header summary is still stale --
          reproduces the reported bug"
        action: "assert"
        target: "fpk"
        asserts:
          tax_ids:
            type: "o2m"
            check: "count"
            expected_count: 1
          amount_tax:
            type: "value"
            expected: 240000.0
          amount_untaxed:
            type: "value"
            expected: 2000000.0

      - step: "Call action_compute_tax again after the manual correction"
        action: "call"
        target: "fpk"
        method: "action_compute_tax"
        as_user: "base.user_admin"

      - step:
          "FIX: the header summary now splits into one line per tax and reflects the
          corrected 11% line"
        action: "assert"
        target: "fpk"
        asserts:
          tax_ids:
            type: "o2m"
            check: "count"
            expected_count: 2
          amount_tax:
            type: "value"
            expected: 230000.0
          amount_untaxed:
            type: "value"
            expected: 2000000.0
          amount_total:
            type: "value"
            expected: 2230000.0

      - step: "Get the recomputed 12% tax summary line"
        action: "search"
        model: "faktur_pajak_keluaran_tax"
        domain:
          - ["faktur_pajak_keluaran_id", "=", "EVAL: registry['fpk'].id"]
          - ["tax_id", "=", "EVAL: registry['tax_12'].id"]
        save_as: "tax_line_12_after"
        expect_count: 1

      - step: "The 12% line still covers only the first detail line"
        action: "assert"
        target: "tax_line_12_after"
        asserts:
          base_amount:
            type: "value"
            expected: 1000000.0
          tax_amount:
            type: "value"
            expected: 120000.0

      - step: "Get the new 11% tax summary line"
        action: "search"
        model: "faktur_pajak_keluaran_tax"
        domain:
          - ["faktur_pajak_keluaran_id", "=", "EVAL: registry['fpk'].id"]
          - ["tax_id", "=", "EVAL: registry['tax_11'].id"]
        save_as: "tax_line_11"
        expect_count: 1

      - step: "The 11% line covers the corrected second detail line"
        action: "assert"
        target: "tax_line_11"
        asserts:
          base_amount:
            type: "value"
            expected: 1000000.0
          tax_amount:
            type: "value"
            expected: 110000.0

      - step: "Calling action_compute_tax again does not duplicate lines"
        action: "call"
        target: "fpk"
        method: "action_compute_tax"
        as_user: "base.user_admin"

      - step: "Tax summary line count stays at two after recompute"
        action: "assert"
        target: "fpk"
        asserts:
          tax_ids:
            type: "o2m"
            check: "count"
            expected_count: 2

      # --- pre_confirm_action: recompute happens automatically before
      # confirmation, even when Compute Tax was never clicked manually.
      - step: "Create a second Faktur Pajak Keluaran draft"
        action: "create"
        model: "faktur_pajak_keluaran"
        save_as: "fpk_confirm"
        as_user: "base.user_admin"
        values:
          type_id: "EVAL: registry['fp_type_open'].id"
          tax_id: "EVAL: registry['tax_11'].id"
          partner_id: "EVAL: registry['partner'].id"
          klikpajak_backend_id: "EVAL: registry['klikpajak_backend'].id"
          date: 2026-01-15
          efaktur_mode: "detail"

      - step: "Create one detail line taxed at 11%"
        action: "create"
        model: "faktur_pajak_keluaran_detail"
        save_as: "detail_confirm"
        as_user: "base.user_admin"
        values:
          faktur_pajak_keluaran_id: "EVAL: registry['fpk_confirm'].id"
          name: "Test Compute Tax FPK Confirm Line"
          account_id: "EVAL: registry['income_account'].id"
          uom_quantity: 1
          price_unit: 1000000.0
          tax_ids:
            - - 6
              - 0
              - - "EVAL: registry['tax_11'].id"

      - step:
          "Before confirm, Compute Tax was never called -- the tax summary is still
          empty"
        action: "assert"
        target: "fpk_confirm"
        asserts:
          state:
            type: "value"
            expected: "draft"
          tax_ids:
            type: "o2m"
            check: "count"
            expected_count: 0
          amount_tax:
            type: "value"
            expected: 0.0

      - step: "Confirm without ever clicking Compute Tax"
        action: "call"
        target: "fpk_confirm"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step:
          "FIX: the pre_confirm_action hook recomputed the tax summary automatically"
        action: "assert"
        target: "fpk_confirm"
        asserts:
          tax_ids:
            type: "o2m"
            check: "count"
            expected_count: 1
          amount_tax:
            type: "value"
            expected: 110000.0
          amount_total:
            type: "value"
            expected: 1110000.0

      # --- base_amount / Include-tax bug (found via live data FPK id=14 /
      # invoice CLM/2607/001): action_reload_detail copies aml.credit
      # (always tax-exclusive) into a detail line's price_unit. That is
      # correct only while the line's tax stays an Exclude-type tax. Once
      # a user corrects the line's tax (the workflow above) to an
      # Include-type tax matching the source invoice,
      # account.tax.compute_all treats the unchanged price_unit as
      # already tax-inclusive and strips tax out of it a second time,
      # silently shrinking the DPP/PPN below the invoice's real amounts.
      # The fix anchors the tax-exclusive base in `base_amount` and
      # re-derives `price_unit` from it whenever the tax changes.
      - step: "Create an 11% output VAT (include)"
        action: "create"
        model: "account.tax"
        save_as: "tax_11_include"
        values:
          name:
            "EVAL: 'Test Compute Tax FPK VAT 11pct Include %d' %
            env['account.tax'].search_count([])"
          amount_type: "percent"
          amount: 11.0
          type_tax_use: "sale"
          price_include: true
          invoice_repartition_line_ids:
            - - 0
              - 0
              - factor_percent: 100
                repartition_type: "base"
            - - 0
              - 0
              - factor_percent: 100
                repartition_type: "tax"
                account_id: "EVAL: registry['tax_account'].id"
          refund_repartition_line_ids:
            - - 0
              - 0
              - factor_percent: 100
                repartition_type: "base"
            - - 0
              - 0
              - factor_percent: 100
                repartition_type: "tax"
                account_id: "EVAL: registry['tax_account'].id"

      - step: "Create a third Faktur Pajak Keluaran draft (base_amount scenario)"
        action: "create"
        model: "faktur_pajak_keluaran"
        save_as: "fpk_base_amount"
        as_user: "base.user_admin"
        values:
          type_id: "EVAL: registry['fp_type_open'].id"
          tax_id: "EVAL: registry['tax_12'].id"
          partner_id: "EVAL: registry['partner'].id"
          klikpajak_backend_id: "EVAL: registry['klikpajak_backend'].id"
          date: 2026-01-15
          efaktur_mode: "detail"

      # `base_amount` is the tax-exclusive DPP `action_reload_detail`
      # would have copied from the source invoice line's accounting
      # entry (`aml.credit`) -- it must never change afterwards.
      - step: "Create a detail line with base_amount anchored, taxed at 11% (exclude)"
        action: "create"
        model: "faktur_pajak_keluaran_detail"
        save_as: "detail_base_amount"
        as_user: "base.user_admin"
        values:
          faktur_pajak_keluaran_id: "EVAL: registry['fpk_base_amount'].id"
          name: "Test Compute Tax FPK Base Amount Line"
          account_id: "EVAL: registry['income_account'].id"
          uom_quantity: 1
          price_unit: 1000000.0
          base_amount: 1000000.0
          tax_ids:
            - - 6
              - 0
              - - "EVAL: registry['tax_11'].id"

      - step: "DPP matches base_amount while the line's tax is Exclude"
        action: "assert"
        target: "detail_base_amount"
        asserts:
          price_subtotal:
            type: "value"
            expected: 1000000.0

      - step:
          "Manually correct the base_amount line's tax to 11% Include (simulates the
          Compute Tax workflow above)"
        action: "write"
        target: "detail_base_amount"
        as_user: "base.user_admin"
        values:
          tax_ids:
            - - 6
              - 0
              - - "EVAL: registry['tax_11_include'].id"

      - step: "Call action_compute_tax after switching to the Include tax"
        action: "call"
        target: "fpk_base_amount"
        method: "action_compute_tax"
        as_user: "base.user_admin"

      - step:
          "FIX: price_unit is grossed up and DPP/PPN stay anchored to base_amount,
          instead of shrinking from stripping tax twice"
        action: "assert"
        target: "detail_base_amount"
        asserts:
          price_unit:
            type: "value"
            expected: 1110000.0
          price_subtotal:
            type: "value"
            expected: 1000000.0
          price_tax:
            type: "value"
            expected: 110000.0

      - step:
          "Create a manual detail line without base_amount (not sourced from an invoice)"
        action: "create"
        model: "faktur_pajak_keluaran_detail"
        save_as: "detail_manual"
        as_user: "base.user_admin"
        values:
          faktur_pajak_keluaran_id: "EVAL: registry['fpk_base_amount'].id"
          name: "Test Compute Tax FPK Manual Line"
          account_id: "EVAL: registry['income_account'].id"
          uom_quantity: 1
          price_unit: 500000.0
          tax_ids:
            - - 6
              - 0
              - - "EVAL: registry['tax_11_include'].id"

      - step: "Call action_compute_tax again"
        action: "call"
        target: "fpk_base_amount"
        method: "action_compute_tax"
        as_user: "base.user_admin"

      - step: "A line without base_amount is left untouched by action_compute_tax"
        action: "assert"
        target: "detail_manual"
        asserts:
          price_unit:
            type: "value"
            expected: 500000.0

      # --- Same bug, but with an Include tax reconfigured as a custom
      # `python_compute` ("code") tax instead of a plain `percent` tax --
      # found on the SGRS production server: "PPN Keluaran 11% (Include)"
      # was changed from `amount_type: percent` to `amount_type: code`
      # with `gross * 11 / 111` (mathematically the same 11% Include tax,
      # just no longer expressed as a plain percentage). The gross-up
      # must not assume a formula, so it works here too.
      - step: "Create an 11% output VAT (include, custom code formula)"
        action: "create"
        model: "account.tax"
        save_as: "tax_11_include_code"
        values:
          name:
            "EVAL: 'Test Compute Tax FPK VAT 11pct Include Code %d' %
            env['account.tax'].search_count([])"
          amount_type: "code"
          amount: 11.0
          type_tax_use: "sale"
          price_include: true
          python_compute:
            "gross = price_unit * quantity\nresult = int(gross * 11 / 111 +
            0.5)"
          invoice_repartition_line_ids:
            - - 0
              - 0
              - factor_percent: 100
                repartition_type: "base"
            - - 0
              - 0
              - factor_percent: 100
                repartition_type: "tax"
                account_id: "EVAL: registry['tax_account'].id"
          refund_repartition_line_ids:
            - - 0
              - 0
              - factor_percent: 100
                repartition_type: "base"
            - - 0
              - 0
              - factor_percent: 100
                repartition_type: "tax"
                account_id: "EVAL: registry['tax_account'].id"

      - step: "Create a fourth Faktur Pajak Keluaran draft (code-tax scenario)"
        action: "create"
        model: "faktur_pajak_keluaran"
        save_as: "fpk_code_tax"
        as_user: "base.user_admin"
        values:
          type_id: "EVAL: registry['fp_type_open'].id"
          tax_id: "EVAL: registry['tax_12'].id"
          partner_id: "EVAL: registry['partner'].id"
          klikpajak_backend_id: "EVAL: registry['klikpajak_backend'].id"
          date: 2026-01-15
          efaktur_mode: "detail"

      - step: "Create a detail line with base_amount, taxed with the code Include tax"
        action: "create"
        model: "faktur_pajak_keluaran_detail"
        save_as: "detail_code_tax"
        as_user: "base.user_admin"
        values:
          faktur_pajak_keluaran_id: "EVAL: registry['fpk_code_tax'].id"
          name: "Test Compute Tax FPK Code Tax Line"
          account_id: "EVAL: registry['income_account'].id"
          uom_quantity: 1
          price_unit: 41869088.29
          base_amount: 41869088.29
          tax_ids:
            - - 6
              - 0
              - - "EVAL: registry['tax_11_include_code'].id"

      - step: "Call action_compute_tax for the code-tax line"
        action: "call"
        target: "fpk_code_tax"
        method: "action_compute_tax"
        as_user: "base.user_admin"

      - step:
          "FIX: DPP stays anchored to base_amount for a custom code Include tax too,
          not just plain percent taxes"
        action: "assert"
        target: "detail_code_tax"
        asserts:
          price_unit:
            type: "value"
            expected: 46474688.29
          price_subtotal:
            type: "value"
            expected: 41869088.29
          price_tax:
            type: "value"
            expected: 4605600.0
